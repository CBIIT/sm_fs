<div class="ms-3">

  <a class="text-decoration-none small" href="javascript:void(0)" (click)="goBack()">
    &lt; Back to {{ selectionDate }}
  </a>

  <h2 class="mt-3 mb-4">Bulk Edit</h2>

  <!-- Bulk-apply form -->
  <form #bulkForm="ngForm">
    <div class="row mb-3">
      <div class="col-4">
        <label class="form-label fw-semibold">Budget Categories</label>
        <ng-select2
          id="bulk-budget-cat"
          name="bulkBudgetCategories"
          [(ngModel)]="bulkFields.budgetCategories"
          [data]="budgetCategoryOptions"
          [allowClear]="true"
          width="100%"
        </ng-select2>
      </div>
      <div class="col-4">
        <label class="form-label fw-semibold">DOC Decision</label>
        <ng-select2
          id="bulk-doc-decision"
          name="bulkDocDecision"
          [(ngModel)]="bulkFields.docDecision"
          [data]="decisionOptions"
          [allowClear]="true"
          width="100%"
        </ng-select2>
      </div>
      <div class="col-4">
        <label class="form-label fw-semibold">DOC / NCI Selection</label>
        <ng-select2
          id="bulk-doc-nci-sel"
          name="bulkDocNciSelection"
          [(ngModel)]="bulkFields.docNciSelection"
          [data]="docNciOptions"
          [allowClear]="true"
          width="100%"
        </ng-select2>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-4">
        <label class="form-label fw-semibold">Two-Year Annual Funding R01 (HRHR)</label>
        <ng-select2
          id="bulk-annual-r01"
          name="bulkAnnualFundingR01"
          [(ngModel)]="bulkFields.annualFundingR01"
          [data]="yesNoOptions"
          [allowClear]="true"
          width="100%"
        </ng-select2>
      </div>
      <div class="col-4">
        <label class="form-label fw-semibold">Annual or MYF</label>
        <ng-select2
          id="bulk-annual-myf"
          name="bulkAnnualOrMyf"
          [(ngModel)]="bulkFields.annualOrMyf"
          [data]="annualMyfOptions"
          [allowClear]="true"
          width="100%"
        </ng-select2>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-6">
        <label class="form-label fw-semibold">DOC Notes</label>
        <textarea
          class="form-control"
          name="bulkDocNotes"
          [(ngModel)]="bulkFields.docNotes"
          rows="4"
          maxlength="1000"
        </textarea>
        <div class="text-end text-muted small">{{ bulkFields.docNotes?.length || 0 }}/1000</div>
      </div>
      <div class="col-6">
        <label class="form-label fw-semibold">OEFIA Notes</label>
        <textarea
          class="form-control"
          name="bulkOefiaNotes"
          [(ngModel)]="bulkFields.oefiaNotes"
          rows="4"
          maxlength="1000"
        </textarea>
        <div class="text-end text-muted small">{{ bulkFields.oefiaNotes?.length || 0 }}/1000</div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mb-4">
      <button type="button" class="btn btn-outline-secondary" (click)="onReset()">Reset</button>
      <button type="button" class="btn btn-primary ms-3" (click)="onApplyChanges()">Apply Changes</button>
    </div>
  </form>

  <!-- Per-row DataTable -->
  <div class="row">
    <div class="col-12">
      <table datatable
             [dtOptions]="dtOptions"
             [dtTrigger]="dtTrigger"
             class="row-border hover"
             style="width: 100%">
      </table>

      <!-- Cell renderer templates — one per editable column -->
      <ng-template #fullGrantNumberRenderer let-data="adtData">
        <app-full-grant-number-cell-renderer
          [data]="data"
          [eGrantsUrl]="eGrantsUrl"
          [grantViewerUrl]="grantViewerUrl"
          [i2eURL]="i2eURL">
        </app-full-grant-number-cell-renderer>
      </ng-template>

      <ng-template #budgetCatRenderer let-data="adtData">
        <ng-select2
          [id]="'bcat-' + data.applId"
          [(ngModel)]="data.budgetCategories"
          [data]="budgetCategoryOptions"
          [allowClear]="true"
          width="100%">
        </ng-select2>
      </ng-template>

      <ng-template #docDecisionRenderer let-data="adtData">
        <ng-select2
          [id]="'ddec-' + data.applId"
          [(ngModel)]="data.docDecision"
          [data]="decisionOptions"
          [allowClear]="true"
          width="100%">
        </ng-select2>
      </ng-template>

      <ng-template #docNciSelRenderer let-data="adtData">
        <ng-select2
          [id]="'dnci-' + data.applId"
          [(ngModel)]="data.docNciSelection"
          [data]="docNciOptions"
          [allowClear]="true"
          width="100%">
        </ng-select2>
      </ng-template>

      <ng-template #annualR01Renderer let-data="adtData">
        <ng-select2
          [id]="'ar01-' + data.applId"
          [(ngModel)]="data.annualFundingR01"
          [data]="yesNoOptions"
          [allowClear]="true"
          width="100%">
        </ng-select2>
      </ng-template>

      <ng-template #annualMyfRenderer let-data="adtData">
        <ng-select2
          [id]="'amyf-' + data.applId"
          [(ngModel)]="data.annualOrMyf"
          [data]="annualMyfOptions"
          [allowClear]="true"
          width="100%">
        </ng-select2>
      </ng-template>

      <ng-template #docNotesRenderer let-data="adtData">
        <div>
          <textarea class="form-control form-control-sm notes-textarea"
            [(ngModel)]="data.docNotes"
            rows="2"
            maxlength="2000">
          </textarea>
          <div class="char-count">{{ data.docNotes?.length || 0 }}/2000</div>
        </div>
      </ng-template>

      <ng-template #oefiaNotesRenderer let-data="adtData">
        <div>
          <textarea class="form-control form-control-sm notes-textarea"
            [(ngModel)]="data.oefiaNotes"
            rows="2"
            maxlength="2000">
          </textarea>
          <div class="char-count">{{ data.oefiaNotes?.length || 0 }}/2000</div>
        </div>
      </ng-template>
    </div>
  </div>

  <div class="d-flex justify-content-end mb-4 mt-3">
    <button type="button" class="btn btn-primary" (click)="onSave()" [disabled]="!rows.length">Save</button>
  </div>

</div>
