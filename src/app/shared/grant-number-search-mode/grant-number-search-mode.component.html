<div class="row form-group">
  <div class="col-12">
    <div class="grant-mode-radio-group" role="radiogroup" aria-label="Grant Number Search Mode">
      <div class="grant-mode-option">
        <input
          type="radio"
          class="grant-mode-radio"
          name="grantNumberSearchMode"
          id="grant-number-search-single"
          [checked]="mode === 'single'"
          (change)="onModeChange('single')"
        >
        <label class="grant-mode-option-label" for="grant-number-search-single">Single Grant Number</label>
      </div>

      <div class="grant-mode-option">
        <input
          type="radio"
          class="grant-mode-radio"
          name="grantNumberSearchMode"
          id="grant-number-search-multiple"
          [checked]="mode === 'multiple'"
          (change)="onModeChange('multiple')"
        >
        <label class="grant-mode-option-label" for="grant-number-search-multiple">Multiple Grant Numbers</label>
      </div>
    </div>

    <div *ngIf="mode === 'single'" class="mt-3 ms-3">
      <lib-grantnumber-search-criteria [form]="form"></lib-grantnumber-search-criteria>
    </div>

    <div *ngIf="mode === 'multiple'" class="mt-3">
      <p id="multipleGrantNumbersHelp" class="mb-3">
        Enter or paste Grant Numbers below. Separate them with a comma, a space, or by entering each Grant Number on a new line.
      </p>
      <div class="grant-number-text-wrap">
        <label for="multipleGrantNumbers" class="grant-number-text-label">Grant Numbers</label>
        <div class="grant-number-text-input-wrap">
          <textarea
            id="multipleGrantNumbers"
            name="multipleGrantNumbers"
            class="form-control grant-number-textarea"
            rows="2"
            placeholder="1R01CA111111-01, 2U01CA222222-02"
            [attr.aria-describedby]="'multipleGrantNumbersHelp multipleGrantNumbersCounter' + (multipleGrantNumberValidationMessage ? ' multipleGrantNumbersFeedback' : '')"
            [attr.aria-invalid]="multipleGrantNumberValidationMessage ? 'true' : null"
            [ngModel]="multipleGrantNumbers"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="onMultipleGrantNumbersChange($event)"
          ></textarea>
          <div id="multipleGrantNumbersCounter" class="grant-number-counter small">
            {{ multipleGrantNumberCount }}/1000
          </div>
          <div
            *ngIf="multipleGrantNumberValidationMessage as validationMessage"
            id="multipleGrantNumbersFeedback"
            class="invalid-feedback d-block"
          >
            {{ validationMessage }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
